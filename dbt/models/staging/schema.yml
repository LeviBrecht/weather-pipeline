version: 2

models:
  - name: stg_weather_hourly
    description: "Bereinigte stündliche Wetterdaten, eine Zeile pro Stadt und Stunde (UTC)"
    columns:
      - name: city
        tests:
          - not_null
      - name: hour_ts
        tests:
          - not_null
      - name: temperature_c
        description: "Temperatur in 2 m Höhe in °C"
      - name: precipitation_mm
        description: "Niederschlag der Stunde in mm"
        tests:
          - not_null